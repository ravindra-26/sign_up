<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-div">
        <div class="product-con">
            <img src="ganesha.png" alt="ganeshimg">
             
               <div class="price-con">
                    <span class="name"> Ravi Enterprises</span><br><br>
                    <span class="lord">Lord Ganesha</span><br><br>
                    <span class="discount-prise">₹325</span>
                    <span class="original-prise">₹449</span>
                    <span class="discount">27%</span>
                </div><br>
                  <button>Add Cart</button>
                 
           
        </div>

        <div class="product-con">
            <img src="watch.webp" alt="watchimg">
              <div class="price-con">
                    <span class="name"> Ravi Enterprises</span><br><br>
                    <span class="lord">Watch</span><br><br>
                    <span class="discount-prise">₹1,999</span>
                    <span class="original-prise">₹6,999</span>
                    <span class="discount">71%</span>
                </div><br>
                  <button>Add Cart</button>
        </div>

        <div class="product-con">
            <img src="ring.png" alt="ringimg">
              <div class="price-con">
                    <span class="name"> Ravi Enterprises</span><br><br>
                    <span class="lord">Gold Ring</span><br><br>
                    <span class="discount-prise">₹14,875</span>
                    <span class="original-prise">₹19,999</span>
                    <span class="discount">25%</span>
                </div><br>
                  <button>Add Cart</button>
        </div>

        <div class="product-con">
            <img src="t-shirt.png" alt="tshirtimg">
             <div class="price-con">
                    <span class="name"> Ravi Enterprises</span><br><br>
                    <span class="lord">T-shirt</span><br><br>
                    <span class="discount-prise">₹365</span>
                    <span class="original-prise">₹1,999</span>
                    <span class="discount">81%</span>
                </div><br>
             <button>Add Cart</button>
        </div>

        <div class="product-con">
            <img src="panda.png" alt="pandaimg">
             <div class="price-con">
                    <span class="name"> Ravi Enterprises</span><br><br>
                    <span class="lord">Panda Toy</span><br><br>
                    <span class="discount-prise">₹260</span>
                    <span class="original-prise">₹699</span>
                    <span class="discount">62%</span>
                </div><br>
             <button>Add Cart</button>
        </div>

    </div>
    
</body>
</html>

<style>
    body {
    font-family: Arial, sans-serif;
    background: #f88686;
     padding: 20px;
   
}
    .main-div{
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 20px;
    padding-top: 70px;
    }
   .product-con{
     background: #f88686;  
    padding: 15px;
    text-align: center;
    border-radius: 12px;
    box-shadow: 0 8px 16px rgba(0,0,0,0.15);
    transition: transform 0.3s;
    height: 250px;
   }
   .product-con:hover{
    box-shadow: 0px 0px 10px rgb(233, 250, 2);
    transform: translateY(-5px);
   }
   .product-con img{
    width: 100px;
    height: 100px;
    
   }
   button{
    font-weight: bolder;
    color: blue;
   }
   .name{
     font-weight: bolder;     
   }
   .lord{
    font-size: 12px;
    font-weight: bolder;
    padding-bottom: 15px;
   }
   .discount-prise{
    font-weight: bolder;
    margin-right: 5px;
    font-size: 10px;

   }
   .original-prise{
    text-decoration: line-through;
    color: rgb(94, 91, 91);
    font-weight: bold;
    font-size: 12px;
    margin-right: 5px;
   }
   .discount{
    font-weight: bolder;
    color: rgb(5, 206, 5);
    font-size: 12px;
   }
   button:hover{
    border-color: gold;
    color:rgb(10, 199, 10);
   }
  


  
</style>
