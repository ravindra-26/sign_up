<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Profile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="profile-card">
    <img src="mypic.jpeg" alt="Profile Photo" class="profile-img">

    <h2>Ravindra Chowdary</h2>
    <p class="role">Frontend Developer</p>

    <p class="bio">
        Passionate web developer learning HTML, CSS, and JavaScript.
        creating clean UI designs and responsive websites.
    </p>

    <div class="skills">
        <span>HTML</span>
        <span>CSS</span>
        <span>JavaScript</span>
        <span>UI Design</span>
    </div>

    <div class="social">
        <a href="#">GitHub</a>
        <a href="#">LinkedIn</a>
        <a href="#">Portfolio</a>
    </div>
</div>

</body>
</html>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg, #667eea, #764ba2);
}

.profile-card{
    background:#fff;
    width:320px;
    padding:25px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
    transition:0.4s;
}

.profile-card:hover{
    transform: translateY(-10px);
}

.profile-img{
    width:120px;
    height:120px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid #667eea;
}

.profile-card h2{
    margin-top:15px;
    color:#333;
}

.role{
    color:#667eea;
    font-weight:bold;
    margin:5px 0;
}

.bio{
    font-size:14px;
    color:#555;
    margin:15px 0;
}

.skills{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
    margin-bottom:15px;
}

.skills span{
    background:#f1f1f1;
    padding:6px 10px;
    border-radius:20px;
    font-size:12px;
}

.social{
    display:flex;
    justify-content:space-around;
}

.social a{
    text-decoration:none;
    color:white;
    background:#667eea;
    padding:8px 12px;
    border-radius:20px;
    font-size:13px;
    transition:0.3s;
}

.social a:hover{
    background:#764ba2;
}
</style>
