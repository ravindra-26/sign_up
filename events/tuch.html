<!DOCTYPE html>
<html>
<head>
  <title>Touch Start Event</title>
  <style>
    #box {
      width: 200px;
      height: 200px;
      background: lightcoral;
      text-align: center;
      line-height: 200px;
      font-size: 20px;
    }
  </style>
</head>
<body>

<div id="box">Touch Me</div>

<script>
let box = document.getElementById("box");

box.addEventListener("touchstart", function () {
  box.innerHTML = "Touched!";
  box.style.background = "lightgreen";
});
</script>

</body>
</html>
