<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <img src="ganesha.png" alt="">
</body>
</html>
<script>
    document.getElementsByTagName('img')[0].addEventListener('mouseover' ,over)

    function over(){
        document.getElementsByTagName('img')[0].setAttribute('src', 'panda.png')
        document.getElementsByTagName('img')[0].style.width='500px'
        document.getElementsByTagName('img')[0].style.height='500px'

    }

    document.getElementsByTagName('img')[0].addEventListener('mouseout', out)

    function out(){
        document.getElementsByTagName('img')[0].setAttribute('src', 'ganesha.png')
        document.getElementsByTagName('img')[0].style.width='500px'
        document.getElementsByTagName('img')[0].style.height='500px'
    }


</script>
