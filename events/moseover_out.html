<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <button >mouseover</button>
  
  
</body>

</html>
<script>
  document.getElementsByTagName('button')[0].addEventListener('mouseover', over)

  function over(){
    document.getElementsByTagName("button")[0].style.backgroundColor='red'
    document.getElementsByTagName("button")[0].style.color='white'
    document.getElementsByTagName("button")[0].style.width='200px'
    document.getElementsByTagName("button")[0].style.height='200px'
  }
   document.getElementsByTagName('button')[0].addEventListener('mouseout', out)
   function out(){

    document.getElementsByTagName("button")[0].style.backgroundColor=''
    document.getElementsByTagName("button")[0].style.color='black'
    document.getElementsByTagName("button")[0].style.width='200px'
    document.getElementsByTagName("button")[0].style.height='200px'

     }
   
  
  
</script>
