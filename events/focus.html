<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" placeholder="enter your name">
</body>
<script>
    document.getElementsByTagName('input')[0].addEventListener('focus', focus)

    function focus(){
        document.getElementsByTagName('input')[0].style.border='20px solid red'
    }
    document.getElementsByTagName('input')[0].addEventListener('blur', blr)
    function blr(){
        document.getElementsByTagName('input')[0].style.border=''
    }
</script>
</html>
