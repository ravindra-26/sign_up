<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let product_price = prompt('enter product price')
        let product_discount=prompt('enter product disscount %')        
        let product_GST = prompt('enter GST %')
        finalPrice = product_price * (1 - product_discount/100) * (1 + product_GST/100)
        alert("product final price" +  finalPrice)
    </script>
</body>
</html>
